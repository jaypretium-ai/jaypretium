<style>
/* Layout: 좌측 패턴 인덱스(고정) + 우측 패턴/케이스 뷰. 리서치 터미널 톤, 숫자는 mono. */
:root {
  --bg: #f4f5f7;
  --panel: #ffffff;
  --ink: #16202e;
  --muted: #5d6878;
  --line: #dde1e7;
  --accent: #1d4ed8;
  --good: #0f7a4a;
  --warn: #a16207;
  --bad: #b42318;
  --soft: #eef2fb;
  --f-display: "Source Serif 4", Georgia, serif;
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e131b; --panel: #151c27; --ink: #e4e8ef; --muted: #96a1b2; --line: #263142;
    --accent: #7aa2ff; --good: #4cc38a; --warn: #e0b04a; --bad: #f07a6e; --soft: #1a2436;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e131b; --panel: #151c27; --ink: #e4e8ef; --muted: #96a1b2; --line: #263142;
  --accent: #7aa2ff; --good: #4cc38a; --warn: #e0b04a; --bad: #f07a6e; --soft: #1a2436;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.55 var(--f-body); }
a { color: var(--accent); }
.app { display: grid; grid-template-columns: 260px 1fr; height: 100%; }
nav { background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; padding: 20px 0; }
nav .brand { padding: 0 20px 16px; border-bottom: 1px solid var(--line); margin-bottom: 8px; }
nav .brand b { font: 600 20px var(--f-display); display: block; }
nav .brand span { color: var(--muted); font-size: 12px; }
nav button { all: unset; box-sizing: border-box; display: flex; justify-content: space-between; align-items: center;
  gap: 8px; width: 100%; padding: 8px 20px; cursor: pointer; color: var(--ink); }
nav button:hover { background: var(--soft); }
nav button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
nav button[aria-current="true"] { background: var(--soft); box-shadow: inset 3px 0 var(--accent); font-weight: 600; }
nav .cnt { font: 12px var(--f-mono); color: var(--muted); min-width: 18px; text-align: right; }
nav .cnt.has { color: var(--accent); font-weight: 500; }
main { overflow-y: auto; padding: 28px clamp(16px, 4vw, 48px) 64px; }
.wrap { max-width: 980px; display: grid; gap: 20px; }
.crumb { color: var(--muted); font-size: 12px; letter-spacing: .04em; }
.crumb button { all: unset; cursor: pointer; color: var(--accent); }

.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 18px 20px; }
.def { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.def div { background: var(--panel); padding: 14px 16px; }
.def dt { font-size: 12px; color: var(--muted); font-weight: 600; margin-bottom: 4px; }

.stat .k { font-size: 12px; color: var(--muted); }
.stat .v { font: 500 22px var(--f-mono); font-variant-numeric: tabular-nums; }
.note { font-size: 12px; color: var(--warn); }
.cards { display: grid; gap: 12px; }
.card { all: unset; box-sizing: border-box; cursor: pointer; display: grid; grid-template-columns: 1fr auto; gap: 6px 20px;
  background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--good); border-radius: 6px; padding: 16px 20px; }
.card:hover { border-color: var(--accent); border-left-color: var(--good); }
.card:focus-visible { outline: 2px solid var(--accent); }
.card .t { font-weight: 600; font-size: 16px; }
.card .t small { color: var(--muted); font: 12px var(--f-mono); margin-left: 6px; }
.card .ol { color: var(--muted); grid-column: 1; }
.card .nums { grid-row: 1 / span 2; grid-column: 2; display: flex; gap: 20px; text-align: right; align-items: center; }
.card .nums div { font: 500 18px var(--f-mono); font-variant-numeric: tabular-nums; }
.card .nums span { display: block; font: 11px var(--f-body); color: var(--muted); }
.empty { border: 1px dashed var(--line); border-radius: 6px; padding: 22px; color: var(--muted); text-align: center; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--soft); color: var(--ink); border: 1px solid var(--line); }
.chip.long { color: var(--good); border-color: currentColor; background: transparent; }
.kpis { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 12px; color: var(--muted); font-weight: 600; }
td.m { font-family: var(--f-mono); font-size: 13px; }
.pill { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 4px; white-space: nowrap; }
.pill.hit, .pill.beat { background: color-mix(in srgb, var(--good) 14%, transparent); color: var(--good); }
.pill.late { background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn); }
.pill.bonus { background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); }
.pill.miss { background: color-mix(in srgb, var(--bad) 14%, transparent); color: var(--bad); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
ul.tight { margin: 0; padding-left: 18px; display: grid; gap: 6px; }
.devil { border-left: 4px solid var(--bad); }
.chart svg { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font: 11px var(--f-mono); }
.chart .lbl { fill: var(--ink); font-family: var(--f-body); }
.src { font-size: 12px; color: var(--muted); }
@media (max-width: 820px) {
  .app { grid-template-columns: 1fr; height: auto; }
  nav { border-right: 0; border-bottom: 1px solid var(--line); max-height: 260px; }
  .def, .two { grid-template-columns: 1fr; }
  .stats, .kpis { grid-template-columns: repeat(2, 1fr); }
  .card { grid-template-columns: 1fr; }
  .card .nums { grid-row: auto; grid-column: 1; justify-content: flex-start; text-align: left; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

  document.querySelectorAll("nav button").forEach(b => b.onclick = () => go(b.dataset.k));
}

function caseCard(c) {
  const r = c.result;
  return `<button class="card" data-id="${esc(c.id)}">
    <div class="t">${esc(c.company)}<small>${esc(c.ticker)} · ${esc(c.vic.post_date)} · ${esc(c.direction.toUpperCase())}</small></div>
    <div class="ol">${esc(c.outcome?.one_liner || "")}</div>
    <div class="nums">
      <div>${r.multiple.toFixed(2)}x<span>배수</span></div>
      <div>${pct(r.cagr)}<span>CAGR</span></div>
      <div>${r.years.toFixed(1)}y<span>보유</span></div>
    </div></button>`;
}

function renderPattern(k) {
  const p = P[k], prim = primaryOf(k), all = byPattern(k);
  const sec = all.filter(c => !prim.includes(c));
  const cagrs = prim.map(c => c.result.cagr);
  const best = prim.length ? prim.reduce((a, b) => a.result.cagr > b.result.cagr ? a : b) : null;
  document.getElementById("view").innerHTML = `
    <div class="crumb">패턴</div>
    <h1>${esc(p.name)}</h1>
    <dl class="def">
      <div><dt>왜 싸게 거래되나</dt><dd>${esc(p.mispricing)}</dd></div>
      <div><dt>무엇이 가격을 정상화하나</dt><dd>${esc(p.catalyst)}</dd></div>
      <div class="kill"><dt>Kill criteria</dt><dd>${esc(p.kill_criteria)}</dd></div>
    </dl>
    <div class="stats">
      <div class="stat"><div class="k">케이스 수 (주패턴)</div><div class="v">${prim.length}</div></div>
      <div class="stat"><div class="k">CAGR 중앙값</div><div class="v">${pct(median(cagrs))}</div></div>
      <div class="stat"><div class="k">최저 배수</div><div class="v">${prim.length ? Math.min(...prim.map(c => c.result.multiple)).toFixed(2) + "x" : "n/a"}</div></div>
      <div class="stat"><div class="k">대표 사례</div><div class="v" style="font:600 16px var(--f-body)">${best ? esc(best.company) : "—"}</div></div>
    </div>
    ${prim.length && prim.length < 5 ? `<div class="note">표본 ${prim.length}건: 일반화 금지. base rate(같은 유형 전체 피치의 성공 비율) 확보 전까지는 사례 모음으로만 읽을 것.</div>` : ""}
    <section><h2>대표 사례</h2>
      <div class="cards">${prim.length ? prim.sort((a, b) => b.result.cagr - a.result.cagr).map(caseCard).join("") : `<div class="empty">케이스 수집 중. cases/ 폴더에 YAML을 추가하면 이 목록에 나타남.</div>`}</div>
    </section>
    ${sec.length ? `<section><h2>보조 패턴으로 포함된 사례</h2><div class="cards">${sec.map(caseCard).join("")}</div></section>` : ""}`;
  document.querySelectorAll(".card").forEach(b => b.onclick = () => go(slug(b.dataset.id)));
}

function chart(c) {
  const r = c.result, entry = r.entry_date;
  const pts = [{ d: entry, v: r.entry_price, k: "진입" }, ...(c.price_points || []).map(p => ({ d: p.date, v: p.price }))];
  if (c.terminal?.event) pts.push({ d: c.terminal.date, v: c.terminal.value_per_share, k: "인수가" });
  const t = s => new Date(s).getTime();
  const W = 900, H = 300, L = 48, R = 20, T = 20, B = 96;
  const x0 = t(entry), x1 = t(r.exit_date), vmax = Math.ceil(Math.max(...pts.map(p => p.v)) / 10) * 10;
  const X = d => L + (t(d) - x0) / (x1 - x0) * (W - L - R), Y = v => T + (1 - v / vmax) * (H - T - B);
  const grid = [0, .25, .5, .75, 1].map(f => { const v = vmax * f; return `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${L - 8}" y="${Y(v) + 4}" text-anchor="end">$${v}</text>`; }).join("");
  const years = []; for (let y = new Date(entry).getFullYear() + 1; y <= new Date(r.exit_date).getFullYear(); y++) years.push(y);
  const yt = years.map(y => `<text x="${X(y + "-01-01")}" y="${H - B + 16}" text-anchor="middle">${y}</text>`).join("");
  let segs = "";
  for (let i = 1; i < pts.length; i++) {
    const gap = (t(pts[i].d) - t(pts[i - 1].d)) / 864e5 > 400;
    segs += `<line x1="${X(pts[i - 1].d)}" y1="${Y(pts[i - 1].v)}" x2="${X(pts[i].d)}" y2="${Y(pts[i].v)}" stroke="var(--accent)" stroke-width="2.5" ${gap ? 'stroke-dasharray="5 5" opacity=".55"' : ""}/>`;
  }
  const area = `<path d="M${X(pts[0].d)},${Y(0)} ${pts.map(p => `L${X(p.d)},${Y(p.v)}`).join(" ")} L${X(pts.at(-1).d)},${Y(0)}Z" fill="var(--accent)" opacity=".07"/>`;
  const dots = pts.map((p, i) => `<circle cx="${X(p.d)}" cy="${Y(p.v)}" r="${i === pts.length - 1 ? 5 : 3.5}" fill="var(--panel)" stroke="var(--accent)" stroke-width="2"/><text class="lbl" x="${X(p.d) + (i === pts.length - 1 ? -8 : 8)}" y="${Y(p.v) - 8}" text-anchor="${i === pts.length - 1 ? "end" : "start"}">$${p.v.toFixed(2)}</text>`).join("");
  const ev = (c.timeline || []).map((e, i) => { const x = X(e.date); return `<line x1="${x}" x2="${x}" y1="${H - B + 24}" y2="${H - B + 30 + (i % 3) * 18}" stroke="var(--muted)"/><text class="lbl" x="${Math.min(x + 4, W - R)}" y="${H - B + 40 + (i % 3) * 18}" text-anchor="${x > W * .7 ? "end" : "start"}" font-size="11">${esc(e.label)}</text>`; }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="가격 경로">${grid}${yt}${area}${segs}${dots}${ev}</svg>`;
}

function renderCase(c) {
  const r = c.result, p = P[c.pattern.primary];
  const v = c.valuation_at_pitch || {};
  document.getElementById("view").innerHTML = `
    <div class="crumb"><button data-go="${c.pattern.primary}">${esc(p.name)}</button> / 케이스</div>
    <h1>${esc(c.company)} <span style="color:var(--muted);font:500 18px var(--f-mono)">${esc(c.ticker)}</span></h1>
    <div class="chips">
      <span class="chip long">${esc(c.direction.toUpperCase())}</span>
      <span class="chip">${esc(p.name)}</span>
      ${(c.pattern.secondary || []).map(s => `<span class="chip">+ ${esc(P[s]?.name || s)}</span>`).join("")}
      <span class="chip">${esc(c.tags?.market_cap)}</span><span class="chip">${esc(c.tags?.region)}</span>
      <span class="chip">catalyst: ${esc(c.tags?.catalyst_clarity)}</span>
    </div>
    <div class="kpis">
      <div class="stat"><div class="k">총 배수 (배당 포함)</div><div class="v">${r.multiple.toFixed(2)}x</div></div>
      <div class="stat"><div class="k">CAGR</div><div class="v">${pct(r.cagr)}</div></div>
      <div class="stat"><div class="k">1년 수익</div><div class="v">${pct(r.horizon["1y"])}</div></div>
      <div class="stat"><div class="k">진입 P/E</div><div class="v">${v.pe ?? "n/a"}x</div></div>
      <div class="stat"><div class="k">보유 기간</div><div class="v">${r.years.toFixed(1)}y</div></div>
    </div>
    <section class="panel chart"><h2>가격 경로 · 진입 $${r.entry_price.toFixed(2)} → 청산 $${c.terminal?.value_per_share ?? "?"}</h2>${chart(c)}
      <div class="src">점선 = 중간 가격 미확보 구간. 데이터 소스: ${esc(r.source)}. 벤치마크 대비: ${pct(r.bench_cagr)}</div></section>
    <section class="panel"><h2>Thesis 요약</h2><p style="margin:0;max-width:68ch">${esc(c.thesis_summary)}</p></section>
    <section class="panel"><h2>피치 예측 vs 실제</h2><div style="overflow-x:auto"><table>
      <thead><tr><th>항목</th><th>피치</th><th>실제</th><th>판정</th></tr></thead>
      <tbody>${(c.pitch_vs_actual || []).map(x => `<tr><td>${esc(x.item)}</td><td class="m">${esc(x.pitch)}</td><td class="m">${esc(x.actual)}</td><td><span class="pill ${esc(x.verdict)}">${VERDICT[x.verdict] || esc(x.verdict)}</span></td></tr>`).join("")}</tbody>
    </table></div></section>
    <div class="two">
      <section class="panel"><h2>교훈 (패턴 근거)</h2><ul class="tight">${(c.outcome?.lessons || "").split(/\s*\(\d\)\s*/).filter(Boolean).map(s => `<li>${esc(s)}</li>`).join("")}</ul></section>
      <section class="panel devil"><h2>Devil's advocate</h2><ul class="tight">${(c.devils_advocate || []).map(s => `<li>${esc(s)}</li>`).join("")}</ul></section>
    </div>
    <div class="src">원문: <a href="${esc(c.vic.url)}">${esc(c.vic.url)}</a> · 작성자 ${esc(c.vic.author)} · VIC 원문은 저작권 보호, 본 요약은 자체 작성</div>`;
  document.querySelector("[data-go]").onclick = e => go(e.target.dataset.go);
}

function route() {
  const h = location.hash.slice(1);
  const c = C.find(x => slug(x.id) === h);
  if (c) { renderNav(c.pattern.primary); renderCase(c); }
  else { const k = P[h] ? h : (C[0]?.pattern.primary || Object.keys(P)[0]); renderNav(k); renderPattern(k); }
  document.querySelector("main").scrollTop = 0;
}
addEventListener("hashchange", route);
route();
</script>
</body>
</html>
