# 투자 패턴 택소노미 (v0.1)
# - primary_pattern 은 케이스당 1개 (집계 기준). secondary 는 복수 허용(교차분석용).
# - 패턴은 "왜 mispricing 이 존재했나(원인)" + "무엇이 가격을 정상화시켰나(catalyst)" 로 정의한다.
#   섹터/스타일 라벨(예: '테크', '성장주')은 패턴이 아니다.

patterns:
  mutual_conversion:
    name: 상호회사 전환 IPO (demutualization)
    mispricing: 신규 상장 + 커버리지 부재 + 기존 자본 위에 IPO 대금이 얹혀 P/B 0.4-0.7x에서 출발 (thrift 전환과 동일 구조)
    catalyst: 주주 중심 경영 전환, 과잉자본 → 자사주 매입, 잠금기간 후 M&A 허용 (통상 3년)
    kill_criteria: 준비금 부족으로 장부가 자체가 과대계상된 경우, 과잉자본을 저수익 확장에 투입

  spinoff:
    name: 스핀오프 / 분할
    mispricing: 모회사 주주의 강제 매도(지수 제외, mandate 불일치), 애널리스트 커버리지 부재
    catalyst: 분할 완료 후 6-24M 내 독립 실적 공시, 커버리지 개시, 경영진 인센티브 정렬
    kill_criteria: 분할 후 부채를 떠안은 'dumping ground' 구조, 경영진 지분/스톡옵션 부재

  special_situation:
    name: 특수상황 (M&A arb, 청산, 텐더, 구조조정 후 신주)
    mispricing: 복잡성·만기 구조로 일반 투자자 회피, post-reorg 주식의 강제 매도
    catalyst: 거래 종결, 청산 배분, 텐더 실행
    kill_criteria: 규제/파이낸싱 리스크로 deal break 시 downside 가 upside 의 3x 이상

  hidden_assets:
    name: 숨은 자산 / SOTP
    mispricing: 부동산·지분·NOL 등 비영업자산이 실적 기반 멀티플에 반영 안 됨
    catalyst: 자산 매각, 분리 상장, 공시 세분화, 행동주의
    kill_criteria: 경영진이 자산 현금화 의지 없음 (value trap 최다 유형)

  quality_compounder:
    name: 퀄리티 컴파운더 (적정가 매수)
    mispricing: 단기 실적 노이즈·일회성 이슈로 장기 ROIC 대비 저평가
    catalyst: 시간 (재투자 runway). 명시적 catalyst 불필요
    kill_criteria: ROIC 하락 추세, 재투자 기회 소진, 해자 침식

  turnaround:
    name: 턴어라운드 / 운영 개선
    mispricing: 과거 실적 기반 extrapolation, 신규 경영진 효과 미반영
    catalyst: 마진 회복 가시화, 비핵심 사업 정리
    kill_criteria: 유동성 리스크(만기 24M 내 refinancing 불확실)

  capital_allocation:
    name: 자본배분 변화 (자사주 cannibal, 배당정책 전환)
    mispricing: FCF 대비 주주환원 여력 과소평가
    catalyst: 대규모 자사주 소각, 배당 상향, 레버리지 재조정
    kill_criteria: 고평가 구간 자사주 매입, 경영진 보상과 EPS 연동 왜곡

  activist_governance:
    name: 행동주의 / 지배구조 개선
    mispricing: 지배구조 디스카운트 (오너 리스크, 저배당, 비효율 자본)
    catalyst: 행동주의 지분 공시, 이사회 교체, 정책/제도 변화
    kill_criteria: 지배주주 지분 > 50% + 소수주주 보호 장치 부재

  deep_value:
    name: 딥밸류 / 순자산 할인 (net-net 등)
    mispricing: 비인기·소형·유동성 부족, 실적 악화 공포
    catalyst: 대부분 없음 → 분산(basket) 전제. 개별 케이스는 mean reversion 기대
    kill_criteria: 현금 소진(cash burn) 속도 > 할인폭 축소 속도

  cyclical_trough:
    name: 사이클 저점
    mispricing: 저점 이익 기반 고 P/E 착시, 공급 축소 미반영
    catalyst: 공급 구조조정, 재고 사이클 반전
    kill_criteria: 구조적 수요 감소를 사이클로 오인

  rerating_mix_shift:
    name: 사업 믹스 변화 / 재분류 리레이팅
    mispricing: 과거 업종 멀티플 적용 (예 - 하드웨어 → 반복매출)
    catalyst: 세그먼트 공시 변경, 신규 사업 비중 임계치 돌파, 지수/섹터 재분류
    kill_criteria: 신사업 성장률이 기존사업 감소를 상쇄 못함

  structural_discount_arb:
    name: 구조적 할인 차익 (지주사 할인, 우선주/보통주 괴리, 복수 상장)
    mispricing: 유동성·의결권·이중과세 등 구조적 요인
    catalyst: 지배구조 개편, 합병, 배당정책 (참고 - ../backtest_disparity 삼성 우선주 연구)
    kill_criteria: catalyst 없이 '할인율이 높다'만으로 진입

  short_fraud_decline:
    name: 숏 — 회계 부정 / 구조적 쇠퇴 / 과열
    mispricing: 낙관적 회계·내러티브 과열
    catalyst: 감사 의견, 규제 조사, 가이던스 하향
    kill_criteria: 높은 차입비용·숏스퀴즈 리스크, 타이밍 불확실성 (unlimited downside)

# 교차분석용 직교 태그 (패턴과 별개)
tags:
  market_cap: [nano_lt_300m, small_300m_2b, mid_2b_10b, large_gt_10b]
  region: [us, europe, japan, korea, other_asia, em_other]
  catalyst_clarity: [hard_dated, soft, none]   # hard_dated = 날짜가 정해진 이벤트
