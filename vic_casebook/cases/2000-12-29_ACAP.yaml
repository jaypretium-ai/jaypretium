devils_advocate:
  - 핵심 안전장치였던 '보수적 준비금' 주장이 틀림 — 2003 손실 시 보유자는 상당한 낙폭 경험 (MDD 미확인)
  - 수익 대부분이 피치 밖 요인 (하드마켓 사이클, 행동주의, M&A) — thesis 적중이 아니라 '싸게 산 덕'
  - 피치 날짜·URL 미확인, 진입일은 추정. 피치의 P/B 산식은 IPO 주식수와 정합성 불확실
  - 배당 미반영 (보수적), 2003-06 연말 주가 미확보
  - 벤치마크(S&P 500) 같은 기간 연 약 1% 추정 — 2000-10은 '잃어버린 10년'이라 초과수익이 과대 보일 수 있음
