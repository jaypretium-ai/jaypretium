outcome:
  thesis_played_out: partial
  driver_of_return: other    # 1년 EPS 경로는 맞았으나 장기 수익은 하드마켓 + 자사주 + M&A
  lessons: >
    (1) 상호회사 전환 IPO는 낮은 P/B + 과잉자본 + 처음 생긴 이익 유인이라는 구조적 엣지 — 개별 촉매가
    평범해도 작동. (2) 단, 피치의 '보수적 준비금' 주장은 틀림 — 2003-3Q $77.1M 순손실(-$9.03/주) 준비금
    적립. 장부가 할인이 이 충격을 흡수한 안전마진 역할. (3) 장기 수익의 주 원천은 2003-06 med mal 하드마켓
    (요율 급등), 산재·플로리다 철수로 핵심 사업 집중, 대규모 자사주 매입(행동주의 Stilwell 이사회 진입),
    2010 인수 프리미엄 31%. (4) 피치가 예상하지 못한 경로로 수익 — '싸게 산 좋은 자산'의 옵션 가치.
  catalyst_foreseeability: >
    개별 촉매는 경영진 통제 하의 점진적 개선으로 예측 가능했으나, 실제 수익을 만든 하드마켓 사이클과
    M&A는 피치에 없음. 반대로 2003 준비금 쇼크도 피치에 없던 리스크.
  one_liner: P/B 0.44x 상호회사 전환 IPO — 준비금 쇼크를 장부가 할인이 흡수, 하드마켓·자사주·인수로 9.8년 5.5배

