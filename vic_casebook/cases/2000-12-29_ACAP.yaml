thesis_summary: >
  1975년 설립된 미시간 의사 상호회사 출신 의료과실(med mal)·산재보험사. 2000-12 상호회사 전환 IPO($13.50).
  $15에서 P/B 약 0.44x (동종 약 1.0x). 2001 EPS는 (1) 손해율 개선 +$0.50, (2) 채권 포트폴리오 재배분으로
  운용수익률 5%→5.5-6% +$0.30-0.60, (3) 비수익 라인(건강·개인) 철수 +$0.25로 약 $1.95 가능.
  준비금은 비할인 방식으로 보수적이고 사고연도 손해 추이가 유리. 개별 촉매는 평범하나 누적 효과로
  EPS 상승 + 동종 수준 멀티플 회복 기대.

thesis_detail:
  variant_perception: >
    시장: 막 상장한 소형 med mal 보험사 — trailing EPS 약 $1로 '싸지 않다'. 피치: 상호회사 전환으로 이익 극대화
    유인이 처음 생겼고, 운용수익·라인 철수·손해율이라는 경영진이 통제 가능한 레버만으로 EPS가 약 2배 [pitch].
    그 위에 P/B 0.44x라는 자산가치 안전마진이 있음.
  background:
    - 1975 미시간 의사들이 설립한 상호회사 (MICOA) — 대형사들의 med mal 철수 공백
    - 1996 켄터키 KMIC 인수 + 병원·의사그룹 대상 산재보험 진출, 1999 오하이오·플로리다 확장
    - 2000-12-08 IPO 10.3M주 x $13.50 — 상호회사 → 주식회사 전환
    - 1999 매출 $187M (운용수익 $31M), 9M00 순이익 $8.8M [pitch]
    - 미시간·켄터키 1위, 뉴멕시코 2위. 의사 13,000명 이상 커버, 유지율 81% [pitch]
  mechanism:
    - 합산비율 117.2 (1999) → 109 (9M00). 운용수익 포함 operating ratio 98.1% → 90% [pitch]
    - 손해율 개선 +$0.50, 운용수익 +$0.30-0.60, 라인 철수 +$0.25 → 2001E EPS $1.95 (ABN AMRO, IPO 주관사) [pitch]
    - 운용자산 $600M+ 중 채권 80% → 회사채 비중 확대로 수익률 5% → 5.5-6% [pitch]
    - 1건당 보유 한도 $0.5M, 나머지 재보험 → 대형 손실 변동성 제한 [pitch]
    - KMIC 통합 비용절감 연 $2M, 단 관리회사 SCMC 인수 상각 연 $1M으로 일부 상쇄 [pitch]
  valuation:
    - P/B - 0.44x vs 동종 약 1.0x → 동종 수준 회복 시 upside 약 +125% [pitch]
    - P/E - 2001E $1.95 x 동종 12x [est] = $23
    - 결과적으로 2001-08 $22.43 도달 [actual] — 1년 내 P/E 경로는 맞았음
  scenarios:   # 1년 기준, 진입 $15. 확률은 자체 추정 [est]
    - {name: Bull, prob: 0.40, price: 24, logic: "EPS $1.95 x 12x, P/B 약 0.7x"}
    - {name: Base, prob: 0.40, price: 19, logic: "EPS $1.50 x 12.5x"}
    - {name: Bear, prob: 0.20, price: 11, logic: "준비금 추가 적립, P/B 0.3x"}
  market_missed:
    - 상호회사 전환 IPO의 구조적 저평가 — 기존 자본 + IPO 대금 위에서 낮은 P/B로 출발
    - 이익 극대화 유인이 '처음으로' 생긴 조직 — 과거 실적은 비영리적 운영의 결과
    - 과잉자본 → 이후 자사주 매입 여력 (2006년 분할 전 주식수 약 7.8M주 [actual])
  monitoring:
    - 분기 사고연도 손해율 및 전년도 준비금 추이 (favorable → adverse 전환 여부)
    - 운용수익률 5.5% 도달 여부
    - 플로리다 등 신규 주 손해율 — 확장 지역이 가장 위험
    - CEO 소유 대리점(매출 59%) 관계 변화
  kill_criteria:
    - 전년도 준비금 adverse development 발생 (보수적 준비금 thesis 기각)
    - 합산비율 개선 정체 (2001 내 105 이하 미달성)
    - 과잉자본을 저수익 확장 또는 고가 인수에 투입

catalysts:
  - 손해율 개선 (+$0.50 EPS)
  - 운용수익 증가 (+$0.30 EPS)
  - 비수익 라인 철수 (+$0.25 EPS)
  - 동종 대비 낮은 P/B
  - 경영진의 인수 통한 확장 의지
key_risks:
  - med mal 장기꼬리 리스크 — 준비금 부족 시 장부가 자체가 훼손
  - 경영진 고령화 / 승계
  - CEO가 79% 보유한 대리점이 매출 59% — 이해상충·키맨 리스크
  - 경쟁 심화 → 요율 적정성

