# 케이스 템플릿. 파일명: {post_date}_{ticker}.yaml  (예: 2012-03-15_ABC.yaml)
# '_' 로 시작하는 파일은 로더가 무시한다.
#
# 저작권 원칙: VIC 원문을 복사하지 말 것. thesis 는 반드시 '본인 언어로 요약' + URL 링크.
# 인용은 짧은 문장 단위로만(fair use 범위), 출처 표기.

id: 2012-03-15_ABC
ticker: ABC              # 가격 조회용 티커 (yfinance 형식: 005930.KS, 7203.T 등)
company: Example Corp
direction: long          # long | short

vic:
  url: https://valueinvestorsclub.com/idea/EXAMPLE/0000000000
  author: handle_here
  post_date: 2012-03-15
  rating: null           # VIC 회원 평점 (스케일은 수집 시 확인 후 통일, 불확실하면 null)
  contest_winner: false  # 주간 우수 아이디어 선정 여부

pattern:
  primary: spinoff                 # taxonomy.yaml 키
  secondary: [capital_allocation]
tags:
  market_cap: small_300m_2b
  region: us
  catalyst_clarity: soft

valuation_at_pitch:      # 피치 시점 수치 (피치 원문 또는 당시 공시 기준, 모르면 null)
  ev_ebit: null
  pe: null
  fcf_yield_pct: null
  p_b: null
  pitch_target_upside_pct: null   # 피치가 제시한 목표 upside

thesis_summary: >
  (본인 언어로 3-5문장) 왜 싼가 / 무엇이 정상화시키나 / 얼마나 싼가.
catalysts:
  - (예) 분할 후 첫 독립 연간 실적 발표
key_risks:
  - (예) 모회사로부터 이전된 연금 부채

# 수익률 계산 설정
entry:
  date: null             # null 이면 vic.post_date 다음 거래일 종가
benchmark: SPY           # 시장 벤치마크 (KR: ^KS11 / 069500.KS 등)
terminal:                # 상장폐지·인수 등으로 가격 시계열이 끊긴 경우만 기입
  event: null            # acquired | bankrupt | delisted | null
  date: null
  value_per_share: null  # 인수가 / 청산 배분액 (파산이면 0)

# 사후 분석 (수익률 계산 후 작성)
outcome:
  thesis_played_out: null   # yes | partial | no  — 수익과 별개로 '논리가 맞았나'
  driver_of_return: null    # thesis | multiple_expansion_market | luck | other
  lessons: >
    (무엇이 맞았고 무엇이 틀렸나. 수익은 났지만 이유가 틀린 경우 반드시 명시)
