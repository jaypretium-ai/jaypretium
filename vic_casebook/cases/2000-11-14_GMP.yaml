thesis_summary: >
  Hydro-Québec 고정가 장기구매계약 + 1997년 이후 요금인상 거부로 EPS가 1985-96 평균 $2.20에서
  1999년 $0.46으로 붕괴, 배당 $2.12→$0.55 삭감, 주가 $33→$8.25. 그 사이 인력 약 50% 감축 등
  비용구조는 업계 최저 수준으로 슬림화. 2000-11-13 규제당국이 3.42% 요금인상을 예상 밖으로 승인 —
  고정비가 이미 낮아 인상분 대부분이 이익으로 직결(피치 추정 +$0.85/주). 2001E EPS $1.75+ 기준
  P/E 5배 미만, 동종 유틸리티 대비 최저.
catalysts:
  - 2001-01 요금인상 발효 → 2001 EPS 약 2배
  - 단기차입 상환 후 배당 동결 해제 → 배당 성장
  - (보너스) 금리 하락 시 유틸리티 전반 리레이팅
key_risks:
  - Hydro-Québec 계약 손실 지속 (계약 잔존 약 10년)
  - 승인 조건부 배당 동결 장기화
  - 나노캡 유동성 / 커버리지 부재

