outcome:
  thesis_played_out: yes     # 2001 실제 EPS $1.85 (피치 추정 $1.75+), P/E 약 10배로 리레이팅
  driver_of_return: thesis
  lessons: >
    (1) 촉매가 '이미 공개'된 뒤에도 나노캡·무커버리지 종목은 수개월에 걸쳐 underreaction —
    공시 다음날 매수해도 충분했음 (1/1/2001 $12.50 진입 시에도 CAGR 약 20%).
    (2) 핵심은 operating leverage 계산: 비용 구조가 이미 바닥이라 매출 +3.4%가 EPS +85-100%로 증폭.
    (3) 배당 회복은 피치보다 느렸음 (2002 YoC 7.3% vs 피치 12.7%), 그러나 결국 2005년 12% 도달.
    (4) 최종 수익의 상당 부분은 피치에 없던 M&A 프리미엄 (2006 인수) — 썸 오브 thesis + 옵션.
